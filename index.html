<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#061019" />
    <meta name="description" content="PLAN AI Urban Resilience Lab — observe, plan, simulate and adapt." />
    <title>PLAN AI — Urban Resilience Lab</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23061019%22/><path d=%22M20 48V16h14c9 0 15 5 15 13s-6 13-15 13h-6v6zm8-14h6c4 0 7-2 7-5s-3-5-7-5h-6z%22 fill=%22%2375e6ff%22/></svg>" />
    <link rel="preload" as="fetch" href="./models/Idle.fbx" crossorigin />
    <!-- `crossorigin` to match TextureLoader, which requests anonymously. -->
    <link rel="preload" as="image" href="./models/diffuse.png" crossorigin />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Boot / loading veil -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <div class="loader__sigil">
          <span class="sigil sigil--a"></span>
          <span class="sigil sigil--b"></span>
          <span class="sigil sigil--c"></span>
          <span class="sigil sigil--d"></span>
        </div>
        <p class="loader__eyebrow">Urban Resilience Lab</p>
        <h1 class="loader__title">PLAN AI</h1>
        <div class="loader__bar"><i id="loader-fill"></i></div>
        <p class="loader__status" id="loader-status">Growing the crystals…</p>
      </div>
    </div>

    <!-- Heads-up display (populated by src/ui/HUD.js) -->
    <div id="hud" class="hud" aria-live="polite"></div>

    <!-- PLAN AI showcase shell. The original HUD remains available in ?lab=1. -->
    <div id="mission-control" class="mission-control"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
